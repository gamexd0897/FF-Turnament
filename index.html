async function submitForm() {
    const squadName = document.getElementById("squadName").value.trim();

    if (squadName === "") {
        alert("Please enter Squad Name");
        return;
    }

    const tg = window.Telegram.WebApp;

    const data = {
        squad_name: squadName,
        player1_uid: document.getElementById("player1Uid").value.trim(),
        player1_username: document.getElementById("player1Username").value.trim(),
        player2_uid: document.getElementById("player2Uid").value.trim(),
        player2_username: document.getElementById("player2Username").value.trim(),
        player3_uid: document.getElementById("player3Uid").value.trim(),
        player3_username: document.getElementById("player3Username").value.trim(),
        player4_uid: document.getElementById("player4Uid").value.trim(),
        player4_username: document.getElementById("player4Username").value.trim()
    };

    try {
        const response = await fetch("https://ff-turnament.onrender.com/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Telegram-Init-Data": tg.initData
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.detail || "Registration failed. Please try again.");
            return;
        }

        document.getElementById("form").style.display = "none";
        document.getElementById("thanks").style.display = "block";

    } catch (error) {
        alert("Connection error. Please try again.");
        console.error(error);
    }
